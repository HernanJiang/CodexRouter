name: Diagnose packaged Redis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download and start packaged Redis
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'redis-package'
          $expanded = Join-Path $env:RUNNER_TEMP 'redis-expanded'
          $working = Join-Path $env:RUNNER_TEMP 'redis-working'
          New-Item -ItemType Directory -Path $download,$expanded,$working -Force | Out-Null
          gh release download v1.2.1 --repo '${{ github.repository }}' --pattern 'Codex-Router-Portable-*.zip' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed.' }
          Expand-Archive -LiteralPath (Get-ChildItem $download -Filter '*.zip' | Select-Object -First 1).FullName -DestinationPath $expanded
          $root = (Get-ChildItem $expanded -Directory | Select-Object -First 1).FullName
          $server = Join-Path $root 'redis/Redis-8.10.0-Windows-x64-msys2/redis-server.exe'
          $config = Join-Path $root 'config/redis.conf'
          $stdout = Join-Path $env:RUNNER_TEMP 'redis-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'redis-stderr.log'
          & $server --version
          $process = Start-Process -FilePath $server -ArgumentList @($config) -WorkingDirectory $working -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            Write-Host "has_exited=$($process.HasExited)"
            if ($process.HasExited) { Write-Host "exit_code=$($process.ExitCode)" }
            Write-Host '--- stdout ---'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host '--- stderr ---'
            if (Test-Path $stderr) { Get-Content $stderr }
            $listener = Get-NetTCPConnection -State Listen -LocalPort 16379 -ErrorAction SilentlyContinue
            if (-not $listener) { throw 'Packaged Redis did not listen on 16379.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
