name: Theoretical Unix builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  theoretical-unix:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            rust_target: ""
          - os: macos-latest
            label: macos-arm64
            rust_target: ""
          - os: macos-latest
            label: macos-x64
            rust_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ matrix.rust_target == '' }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ matrix.rust_target != '' }}
        with:
          targets: ${{ matrix.rust_target }}

      - name: Verify source version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' codex-router-gui-rust/Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Cargo package version is missing." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag version $tag_version does not match Cargo version $version." >&2
              exit 1
            fi
          fi

      - name: Build theoretical binary
        shell: bash
        run: |
          set -euo pipefail
          args=(build --release --locked --manifest-path codex-router-gui-rust/Cargo.toml)
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            args+=(--target "${{ matrix.rust_target }}")
          fi
          cargo "${args[@]}"
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            echo "BIN=codex-router-gui-rust/target/${{ matrix.rust_target }}/release/codex-router" >> "$GITHUB_ENV"
          else
            echo "BIN=codex-router-gui-rust/target/release/codex-router" >> "$GITHUB_ENV"
          fi

      - name: Package theoretical archive
        shell: bash
        run: |
          set -euo pipefail
          package="CodexRouter-${VERSION}-${{ matrix.label }}-theoretical"
          staging="${RUNNER_TEMP}/${package}"
          mkdir -p "$staging"
          cp "$BIN" "$staging/CodexRouter"
          chmod +x "$staging/CodexRouter"
          cp docs/THEORETICAL-UNIX.md "$staging/README.md"
          {
            echo "CodexRouter ${VERSION}"
            echo "Target: ${{ matrix.label }}"
            echo "This is a theoretical build. It has not been tested on a real machine."
            echo "Repository: https://github.com/HernanJiang/CodexRouter"
          } > "$staging/NOTICE.txt"
          mkdir -p artifacts
          tar -C "$(dirname "$staging")" -czf "artifacts/${package}.tar.gz" "$(basename "$staging")"
          echo "ASSET=artifacts/${package}.tar.gz" >> "$GITHUB_ENV"

      - name: Smoke the theoretical binary
        shell: bash
        run: |
          set -euo pipefail
          file "$BIN"
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            file "$BIN" | grep -Eq "x86_64|i386"
            echo "Cross-compiled theoretical binary verified by file(1); execution is skipped on this runner."
            exit 0
          fi
          set +e
          output="$("$BIN" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -ne 2 ]]; then
            echo "Theoretical binary must exit with status 2, got $status." >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Fq "theoretical"
          printf '%s\n' "$output" | grep -Fq "not been tested"

      - uses: actions/upload-artifact@v4
        with:
          name: theoretical-${{ matrix.label }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
