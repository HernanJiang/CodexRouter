[package]
name = "codex-router-configurator"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default", "persistence"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"
anyhow = "1.0"
chrono = "0.4"
dirs = "5.0"
rfd = "0.15"
rusqlite = { version = "0.33", features = ["bundled"] }

[build-dependencies]
windres = "0.2"
